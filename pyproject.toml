[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "osori-api"
version = "0.1.0"
description = "Osori API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "pwdlib[argon2]>=0.2,<1", "python-dotenv>=1,<2", "pymysql[rsa]>=1.1,<2", "alembic>=1.13,<2"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]
